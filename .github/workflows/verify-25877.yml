name: Verify immutable shard cache
on:
  push:
    branches: [verify/25877-cache]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare candidate and isolated baseline
        run: |
          set -euo pipefail
          mkdir evidence
          echo  | base64 -d > evidence/candidate.patch
          echo  | base64 -d > evidence/tests.patch
          git worktree add --detach "$RUNNER_TEMP/cache-baseline" 35c8dd5854750ef96f52f9dd298a70acd031d5e4
          git -C "$RUNNER_TEMP/cache-baseline" apply "$GITHUB_WORKSPACE/evidence/tests.patch"
          git apply evidence/candidate.patch
          gofmt -w pkg/shardservice/service.go pkg/shardservice/service_read_test.go
          git diff --check
          git diff --numstat > evidence/numstat.txt
          git diff > evidence/candidate.patch
          go version > evidence/toolchain.txt
          GOWORK=off go list -mod=readonly -deps -test -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./pkg/shardservice > evidence/cgo-dependencies.txt
      - name: Build repository native generation
        run: make -j2 cgo
      - name: Prove baseline snapshot failure
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cache-baseline"
          rc=0
          .agents/skills/mo-dev/scripts/mo-cgo-test -v -count=1 -timeout=240s -run '^TestRemoveCachePreservesPublishedSnapshot$' ./pkg/shardservice > "$GITHUB_WORKSPACE/evidence/baseline.log" 2>&1 || rc=$?
          cat "$GITHUB_WORKSPACE/evidence/baseline.log"
          test "$rc" -ne 0
          grep -F -- '--- FAIL: TestRemoveCachePreservesPublishedSnapshot' "$GITHUB_WORKSPACE/evidence/baseline.log"
          grep -F 'a snapshot retained by a reader is immutable' "$GITHUB_WORKSPACE/evidence/baseline.log"
      - name: Focused fixed regressions and consumers
        run: |
          set -euo pipefail
          .agents/skills/mo-dev/scripts/mo-cgo-test -v -count=1 -timeout=240s -run '^(TestRemoveCachePreservesPublishedSnapshot|TestRemoveCacheConcurrentDeletes|TestGetShardsWithAllocated|TestGetShardsWithoutCreate)$' ./pkg/shardservice 2>&1 | tee evidence/focused.log
      - name: Measure and stress exact concurrency test
        run: |
          set -euo pipefail
          .agents/skills/mo-dev/scripts/mo-cgo-test -json -race -count=1 -timeout=240s -run '^TestRemoveCacheConcurrentDeletes$' ./pkg/shardservice > evidence/race-measure.jsonl
          n=$(python3 -c 'import json; rows=[json.loads(x) for x in open("evidence/race-measure.jsonl")]; result=[x for x in rows if x.get("Test")=="TestRemoveCacheConcurrentDeletes" and x.get("Action")=="pass"]; assert len(result)==1; t=result[0].get("Elapsed",0); print(100 if t<=0 else max(1,min(100,int(30/t))))')
          echo "N=$n" > evidence/race-budget.txt
          .agents/skills/mo-dev/scripts/mo-cgo-test -v -race -count="$n" -timeout=240s -run '^TestRemoveCacheConcurrentDeletes$' ./pkg/shardservice 2>&1 | tee evidence/race-stress.log
      - name: Owning package normal and race
        run: |
          set -euo pipefail
          .agents/skills/mo-dev/scripts/mo-cgo-test -v -count=1 -timeout=600s ./pkg/shardservice 2>&1 | tee evidence/package.log
          .agents/skills/mo-dev/scripts/mo-cgo-test -v -race -count=1 -timeout=600s ./pkg/shardservice 2>&1 | tee evidence/package-race.log
      - name: Incremental static gates
        run: |
          set -euo pipefail
          test -z "$(gofmt -l pkg/shardservice/service.go pkg/shardservice/service_read_test.go)"
          export CGO_CFLAGS="-I$GITHUB_WORKSPACE/cgo -I$GITHUB_WORKSPACE/thirdparties/install/include"
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/thirdparties/install/lib"
          go vet -mod=readonly ./pkg/shardservice
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --concurrency 2 -c .golangci.yml --new-from-rev 35c8dd5854750ef96f52f9dd298a70acd031d5e4 ./pkg/shardservice 2>&1 | tee evidence/lint.log
      - name: Preserve exact candidate
        if: always()
        run: |
          mkdir -p evidence/source
          cp pkg/shardservice/service.go pkg/shardservice/service_read_test.go evidence/source/
          git diff --numstat > evidence/numstat.txt
          git diff > evidence/candidate.patch
          git rev-parse HEAD > evidence/verification-head.txt
          sha256sum evidence/source/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-cache-25877-evidence
          path: evidence
